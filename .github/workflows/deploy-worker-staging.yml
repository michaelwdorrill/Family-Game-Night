name: Deploy Worker to Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Refuse placeholder staging D1 configuration
        shell: bash
        run: |
          if grep -q '11111111-1111-1111-1111-111111111111' apps/worker/wrangler.toml; then
            echo 'Replace the placeholder staging D1 database ID before deployment.' >&2
            exit 1
          fi
      - name: Apply staging migrations
        run: pnpm --filter @family-game-night/worker db:migrate:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy staging Worker
        run: pnpm --filter @family-game-night/worker deploy:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
