name = "family-game-night-api"
main = "src/index.ts"
compatibility_date = "2026-09-02"
workers_dev = false

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "family-game-night"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

[env.staging]
name = "family-game-night-api-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
APP_ORIGIN = "https://family-game-night-api-staging.homebase-app.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "family-game-night-staging"
database_id = "62c3a4cc-421c-4e7c-9d47-777e67a6bf1a"
migrations_dir = "../../migrations"

[env.production]
name = "family-game-night-api"
workers_dev = false

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "family-game-night"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

[triggers]
crons = ["* * * * *"]

[env.staging.triggers]
crons = ["* * * * *"]

[env.production.triggers]
crons = ["* * * * *"]
